version: '3.3'
services:
    apt-web:
        restart: always
        # image: brizeium/texlive_ondemand:r4
        build: .
        container_name: apt
        ports:
            - 5001:5001
        volumes:
            - ./swiftlatexpdftex.fmt:/app/swiftlatexpdftex.fmt:ro
            - ./swiftlatexxetex.fmt:/app/swiftlatexxetex.fmt:ro
            - ./public:/app/public:ro
        command: python3 wsgi.py
