version: '3.3'
services:
    apt-web:
        restart: always
        # image: brizeium/texlive_ondemand:r5
        build: .
        container_name: apt
        ports:
            - 5001:5001
        environment:
            TEXLIVE_ENDPOINT: ${TEXLIVE_ENDPOINT:-https://latex.arxtect.cn/latex7/arxtect_version_20251120/}
        volumes:
            - ./stellarlatexpdftex.fmt:/app/stellarlatexpdftex.fmt:ro
            - ./stellarlatexxetex.fmt:/app/stellarlatexxetex.fmt:ro
            - ./stellarlatexluatex.fmt:/app/stellarlatexluatex.fmt:ro
            - ./app.py:/app/app.py:ro
        command: python3 wsgi.py
