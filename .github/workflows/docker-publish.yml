name: Publish Docker image to Docker Hub

on:
  push:
    tags:
      - 'v*' # Push events to tags starting with v (e.g. v1.0, v20.15.10)
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare custom font files
        env:
          MYFONT_S3_URL: ${{ secrets.MYFONT_S3_URL || 'https://example.com/myfont.tar' }} # Use secret or default
        run: |
          echo "Downloading custom fonts from ${{ env.MYFONT_S3_URL }}"
          mkdir -p ./myfont
          wget --no-check-certificate -O ./myfont/myfont.tar "${{ env.MYFONT_S3_URL }}"
          echo "Extracting fonts..."
          tar -xf ./myfont/myfont.tar -C ./myfont --strip-components=1
          echo "Cleaning up downloaded tarball..."
          rm ./myfont/myfont.tar
          echo "Contents of ./myfont directory:"
          ls -l ./myfont

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: codedevin/texalive

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Ensure the tag from GitHub is used for the Docker image
          # The metadata-action usually handles this well by default when a tag push triggers the workflow.
          # For clarity, if we want to explicitly use the GitHub tag:
          # tags: codedevin/texalive:${{ github.ref_name }}
          # However, docker/metadata-action is more robust as it can generate multiple tags (e.g., latest, git tag)
          # Let's verify the output of metadata-action. It should correctly use the git tag.
          # If github.ref_name is like 'refs/tags/v1.0.0', we need to strip 'refs/tags/'.
          # The metadata action handles this:
          # type=ref,event=tag will produce the tag name.

# Debug step to see what github.ref_name is (optional, can be removed)
#      - name: Echo GitHub Ref
#        run: echo "GitHub Ref Name: ${{ github.ref_name }}"

# Debug step to see what tags metadata-action produces (optional)
